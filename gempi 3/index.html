<style>
:root{--bg:#07150f;--panel:rgba(8,20,16,.88);--fg:#f3efe2;--acc:#f2c14e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lb{position:fixed;transform:translate(-50%,-50%);background:var(--panel);border:2px solid transparent;border-radius:10px;padding:3px 9px;font-size:12px;text-align:center;pointer-events:none;white-space:nowrap}
.lb.on{border-color:var(--acc)}.lb b{display:block;font-size:14px}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#msg{background:var(--panel);padding:7px 14px;border-radius:20px;font-size:14px;text-align:center}
#btns{display:flex;gap:8px;pointer-events:auto}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--acc);color:#1b1503;cursor:pointer}
button.alt{background:#2c4a3c;color:var(--fg)}button.alt.on{background:#b3262d}
#gp{background:#e8453c;color:#fff}#gp.fl{animation:p .5s infinite alternate}button:disabled{opacity:.4;cursor:default}
@keyframes p{to{transform:scale(1.12)}}
#ov{position:fixed;inset:0;background:rgba(3,10,7,.82);display:flex;align-items:center;justify-content:center;padding:16px}
#box,#lpbox{background:#10261c;border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:90%;overflow:auto;text-align:center}
#box h1{margin:0 0 6px;letter-spacing:6px;color:var(--acc)}#box p{font-size:13px;line-height:1.5;opacity:.9}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}td,th{padding:5px 4px;border-bottom:1px solid #2c4a3c}
.mm{display:flex;flex-direction:column;gap:10px;margin:16px auto 0;max-width:260px}.mm button{font-size:16px;padding:12px}

#cpop{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:var(--acc);color:#1b1503;font-weight:800;font-size:18px;padding:12px 24px;border-radius:22px;box-shadow:0 6px 24px #0008;display:none;pointer-events:none;text-align:center}
#cm{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);max-width:92%;text-align:center;font-weight:900;font-size:clamp(16px,min(4.2vw,7.2vh),34px);letter-spacing:1px;padding:12px 22px;border-radius:18px;background:var(--panel);border:3px solid var(--acc);color:var(--acc);display:none;pointer-events:none;z-index:4;box-shadow:0 10px 40px #000a;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#cm.royal{background:#f2c14e;color:#1b1503;border-color:#fff3c4}#cm.ace{background:#e8453c;color:#fff;border-color:#ffd2cd}
#cm.kecebur{background:#1f7ae0;color:#fff;border-color:#bfe0ff}

function score(h){const v=h.map(val),n={};h.forEach(c=>n[c.s]=(n[c.s]||0)+1);const k=Object.keys(n).length;
 if(k===1)return v[0]+v[1]+v[2];
 if(k===2)return h.reduce((a,c,i)=>a+(n[c.s]===2?v[i]:-v[i]),0);
 const o=v.slice().sort((a,b)=>b-a);return o[0]-o[1]-o[2];}
function bestOf(h){let b=null;h.forEach((c,i)=>{const s=score(h.filter((_,j)=>j!==i));if(!b||s>b.s)b={s,card:c}});return b;}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function fit(){const w=innerWidth,h=innerHeight;rd.setSize(w,h);cam.aspect=w/h;cam.clearViewOffset();
 const n=(G&&G.n)||4,pts=[];
 for(let i=0;i<n;i++){const t=i*2*Math.PI/n,sn=Math.sin(t),cs=Math.cos(t);
  for(const [rr,o] of [[R+1.1,0],[R,2.9],[R,-2.9],[R-1,0]])pts.push(new THREE.Vector3(sn*rr+cs*o,.5,cs*rr-sn*o));}
 const topB=1-2*40/h,botB=-1+2*((($('bar')&&$('bar').offsetHeight)||90)+14)/h,el=w/h>1.5?.8:1.0,pv=new THREE.Vector3();let d=12,mn=0,mx=0;
 for(d=12;d<90;d+=.25){cam.position.set(0,d*Math.sin(el),d*Math.cos(el));cam.lookAt(0,0,0);cam.updateProjectionMatrix();cam.updateMatrixWorld(true);

  if(ok&&mx-mn<=topB-botB)break;}
 const sh=(topB+botB)/2-(mn+mx)/2;cam.setViewOffset(w,h,0,sh*h/2,w,h);cam.updateProjectionMatrix();cam.updateMatrixWorld(true);}

const BOTS=['Indrot','Adil','Cis','Imam','Yuris','Raup','Mimiw','Apip','Kiwil','Adam'];
function startGame(n,name){Snd.unlock();Snd.music(true);name=name||'Kamu';$('toast').style.opacity=0;$('cm').style.display='none';const bn=shuffle(BOTS.filter(x=>x.toLowerCase()!==name.toLowerCase()));G={n,players:[...Array(n)].map((_,i)=>({name:i?bn[i-1]:name,hand:[],total:0,kc:false,kcN:0})),round:0,starter:0};

function newRound(){fit();G.round++;G.deck=shuffle(cards.slice());G.live=null;G.grave=0;G.busy=true;G.closing=false;$('cpop').style.display='none';$('bc').classList.remove('on');G.closeCard=null;G.drewDisc=false;G.takenOwner=-1;G.hover=null;
 cards.forEach(c=>{c.mesh.visible=false;c.owner=-1});G.players.forEach(p=>{p.hand=[];p.gempi=false});
 for(let k=0;k<3;k++)G.players.forEach(p=>{const c=G.deck.pop();p.hand.push(c);show(c)});
 G.cur=G.starter;G.phase='draw';$('ov').style.display='none';layout();ui();begin();}
function begin(){const p=G.players[G.cur];G.called=false;G.drewDisc=false;G.takenOwner=-1;G.takenCard=null;ui();
 if(G.cur===0){G.busy=false;msg('Giliranmu: ketuk dek'+(G.live?' atau kartu buangan terbuka':'')+' untuk mengambil kartu')}
 else{G.busy=true;msg(p.name+' sedang berpikir…');setTimeout(botDraw,1000)}}
function botDraw(){const p=G.players[G.cur],cs=score(p.hand);let d=false;
 if(G.live){const b=bestOf([...p.hand,G.live]);d=b.s>cs+2||b.s>=28||G.deck.length===0}
 draw(d?'disc':'deck');
 setTimeout(()=>{const b=bestOf(p.hand);discard(b.card,b.s>=28||(b.s>=24&&Math.random()<.2))},1000);}
function draw(from){const p=G.players[G.cur];let c;Snd.draw();
 if(from==='deck'){c=G.deck.pop();if(G.live){bury(G.live);G.live=null}show(c)}
 else{c=G.live;G.live=null;G.drewDisc=true;G.takenOwner=c.owner;G.takenCard=c}
 p.hand.push(c);G.phase='discard';layout();ui();

 const j=(G.cur+1)%G.n,t=pAng(j);c.owner=G.cur;G.live=c;

 if(down){G.closeCard=c;setTimeout(()=>Snd.bell(),350);commentary(p,c);setTimeout(()=>endRound('close'),2500);return}

 else setTimeout(next,800);}
function commentary(p,c){const k=c.r===14?'ace':(c.r>=11?'royal':'plain'),e=$('cm');

 e.className=k;e.style.display='block';e.style.animation='none';void e.offsetWidth;e.style.animation='';

function flash(t,k,ms){const e=$('cm');e.textContent=t;e.className=k;e.style.display='block';e.style.animation='none';void e.offsetWidth;e.style.animation='';clearTimeout(commentary.h);commentary.h=setTimeout(()=>{e.style.display='none'},ms)}

 setTimeout(()=>{$('box').innerHTML=`<h2 style="margin:0">Ronde ${G.round}</h2><p>${head}</p><table><tr><th></th><th>Kartu</th><th>Ronde</th><th>Total</th></tr>${rows}</table><p>Target 1000 · pemain 150+ kembali ke 0 jika tersusul</p>${foot}`;$('ov').style.display='flex';ui()},1800);}
function ui(){const p=G.players[0];let h='';
 if(p.hand.length===3)h='Kartu: '+score(p.hand);else if(p.hand.length===4)h='Terbaik setelah buang: '+bestOf(p.hand).s;
 $('tl').textContent='Ronde '+G.round+' · Dek '+G.deck.length;$('tr').textContent=h;$('bc').disabled=!(G.cur===0&&G.phase==='discard'&&!G.busy);const q=p.hand,qs=q.length===4?bestOf(q).s:score(q);$('gp').disabled=!(G.cur===0&&G.phase!=='end'&&qs>=27&&!p.gempi);$('gp').classList.toggle('fl',!$('gp').disabled);}
$('gp').onclick=()=>{const h=G.players[0].hand,s=h.length===4?bestOf(h).s:score(h);if(s>=27&&!G.players[0].gempi){G.players[0].gempi=true;toast('GEMPI!');ui()}};
$('bc').onclick=()=>{G.closing=!G.closing;$('bc').classList.toggle('on',G.closing);$('cpop').style.display=G.closing?'block':'none';msg(G.closing?'Ketuk kartu yang ingin dipakai untuk menutup game (ketuk TUTUP GAME lagi untuk batal)':'Ketuk kartu untuk membuangnya, atau tekan TUTUP GAME untuk menutup')};
// ---- main menu
function menu(){const live=G&&G.phase&&G.phase!=='end';if(!live)Snd.music(false);
 $('box').innerHTML=`<div style='font-size:30px;letter-spacing:10px;color:#f2c14e'>♠ ♥ ♦ ♣</div><h1 style='font-size:54px;margin:6px 0'>GEMPI</h1><p>Permainan kartu 31 poin</p><div class='mm'>${live?`<button onclick="$('ov').style.display='none'">▶ Lanjutkan</button>`:''}<button onclick='playSetup()'>${live?'Game baru':'▶ Main'}</button><button class='alt' onclick='showLB()'>🏆 Klasemen</button><button class='alt' onclick='howTo()'>📖 Cara bermain</button><button class='alt' id='sndm' onclick='Snd.toggle()'></button></div>`;Snd.refresh();$('ov').style.display='flex'}
let selN=4;
function pickN(n){selN=n;document.querySelectorAll('#nb button').forEach(b=>b.classList.toggle('alt',+b.dataset.n!==n))}
function playSetup(){let nm='';try{nm=localStorage.getItem('gempi_name')||''}catch(e){}
 $('box').innerHTML=`<h2 style='margin:0 0 12px'>Siapa nama kamu?</h2><input id='pn' maxlength='14' placeholder='Tulis namamu' autocomplete='off' style='width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:2px solid #2c4a3c;background:#07150f;color:#f3efe2;text-align:center'><p id='perr' style='color:#ff8a80;min-height:18px;margin:6px 0'></p><h2 style='margin:8px 0 10px'>Berapa jumlah pemain?</h2><div id='nb' style='display:flex;gap:10px;justify-content:center;margin-bottom:16px'><button data-n='4' onclick='pickN(4)'>4</button><button data-n='5' onclick='pickN(5)'>5</button><button data-n='6' onclick='pickN(6)'>6</button></div><div class='mm'><button onclick='goStart()'>Mulai GEMPI</button><button class='alt' onclick='menu()'>← Kembali</button></div>`;
 $('pn').value=nm;pickN(selN)}
function goStart(){const nm=$('pn').value.replace(/[<>&"'`]/g,'').trim().replace(/\s+/g,' ');
 if(!nm){$('perr').textContent='Isi namamu dulu ya.';$('pn').focus();return}
 try{localStorage.setItem('gempi_name',nm)}catch(e){}
 startGame(selN,nm)}
function howTo(){$('box').innerHTML=`<h2 style='margin:0 0 6px'>Cara bermain</h2><ul style='text-align:left;font-size:13px;line-height:1.6'><li>Setiap pemain memegang 3 kartu. Pada gilirannya, ambil 1 kartu dari dek atau dari kartu buangan terbuka, lalu buang 1 dari 4 kartu yang dipegang.</li><li>Nilai tanganmu dihitung dari 3 kartu terbaik: lambang sama dijumlahkan (maks 31), kartu berlambang janggal bernilai minus, dan jika tidak ada lambang yang sama, nilai dimulai dari kartu tertinggi dikurangi dua kartu lainnya. Kartu angka = nilai tertera, J/Q/K = 10, As = 11.</li><li>Saat poin di tanganmu mencapai 27 atau lebih setelah membuang kartu, status GEMPI! otomatis diucapkan untukmu (tidak perlu menekan tombol).</li><li>Ronde berakhir saat dek habis atau seseorang menutup game: tekan TUTUP GAME, lalu pilih kartu yang dipakai untuk menutup. Menutup memberi +50 untukmu dan −50 untuk pemain yang membuang kartu itu, tetapi hanya jika kartu itu kamu ambil dari buangan, tetap kamu pakai di tangan akhir, dan nilai tanganmu tertinggi di ronde itu.</li><li>Bonus kartu penutup: kartu yang kamu buang tertutup untuk menutup game memberi poin ekstra. Kartu angka +50, kartu kerajaan (J, Q, K) +100, As +150. Bonus ini terpisah dari bonus kartu buangan di atas dan bisa digabung.</li><li>Poin diakumulasi dan game berakhir saat ada yang mencapai 1000. Pemain dengan poin 150 atau lebih yang tersusul oleh pemain di bawahnya akan KECEBUR! dan poinnya kembali ke 0.</li><li>Suara (efek kartu, bel, dan musik santai) bisa dimatikan dengan tombol speaker.</li></ul><button class='alt' onclick='menu()'>← Kembali</button>`}
// ---- leaderboard
function recs(){try{return JSON.parse(localStorage.getItem('gempi_recs')||'[]')}catch(e){return[]}}
function saveRec(){const s=G.players.map(p=>({n:p.name,t:p.total,me:p===G.players[0]})).sort((a,b)=>b.t-a.t);const rec={me:G.players[0].total,rank:s.findIndex(x=>x.me)+1,n:G.n,d:Date.now()};try{const a=recs();a.unshift(rec);localStorage.setItem('gempi_recs',JSON.stringify(a.slice(0,30)))}catch(e){}}
function showLB(){let h='<h2 style="margin:0 0 6px">🏆 Klasemen</h2>';
 if(G&&G.players){const s=G.players.slice().sort((a,b)=>b.total-a.total);
  h+='<p>Klasemen langsung · Ronde '+G.round+' · target 1000</p><table><tr><th>#</th><th>Pemain</th><th>Poin</th><th></th></tr>'+s.map((p,r)=>'<tr'+(p===G.players[0]?" class='me'":'')+'><td>'+(r+1)+'</td><td>'+p.name+(p===G.players[0]?' (kamu)':'')+(p.kc?' <span class="kc">KECEBUR!</span>':'')+'</td><td><b>'+p.total+'</b></td><td><div style="height:6px;background:#2c4a3c;border-radius:3px;min-width:70px"><div style="height:6px;border-radius:3px;background:'+(p.total>=150?'#e8453c':'#f2c14e')+';width:'+Math.max(0,Math.min(100,p.total/10))+'%"></div></div></td></tr>').join('')+'</table><p>Bar merah = 150+ poin, kembali ke 0 jika tersusul</p>';}
 const a=recs(),w=a.filter(x=>x.rank===1).length;
 h+='<h3 style="margin:12px 0 0">Riwayatmu</h3>';
 h+=a.length?'<p>Main '+a.length+' · Menang '+w+' · Skor terbaik '+Math.max(...a.map(x=>x.me))+'</p><table><tr><th>Tanggal</th><th>Pemain</th><th>Skormu</th><th>Peringkat</th></tr>'+a.slice(0,5).map(x=>'<tr><td>'+new Date(x.d).toLocaleDateString()+'</td><td>'+x.n+'</td><td>'+x.me+'</td><td>'+x.rank+'</td></tr>').join('')+'</table>':'<p>Belum ada game yang selesai.</p>';
 $('lpb').innerHTML=h;$('lp').style.display='flex';}
// ---- input
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();
function pick(e){mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);
 const o=[deckM];if(G.live)o.push(G.live.mesh);G.players[0].hand.forEach(c=>o.push(c.mesh));
 const h=ray.intersectObjects(o)[0];if(!h)return null;return h.object===deckM?'deck':(cards.find(c=>c.mesh===h.object))}
cv.addEventListener('pointermove',e=>{if(!G||G.busy||G.cur!==0||G.phase!=='discard')return;const k=pick(e),c=(k&&k!=='deck'&&G.players[0].hand.includes(k))?k:null;if(c!==G.hover){G.hover=c;layout()}});
cv.addEventListener('pointerdown',e=>{if(!G||G.busy||G.cur!==0)return;const k=pick(e);if(!k)return;
 if(G.phase==='draw'){if(k==='deck'&&G.deck.length)draw('deck');else if(k!=='deck'&&k===G.live)draw('disc')}
 else if(G.phase==='discard'&&k!=='deck'&&G.players[0].hand.includes(k))discard(k,G.closing)});
// ---- loop
const v=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);
 cards.forEach(c=>{const m=c.mesh,t=m.userData.t;if(!m.visible||!t)return;const f=.16;
  m.position.x+=(t.x-m.position.x)*f;m.position.y+=(t.y-m.position.y)*f;m.position.z+=(t.z-m.position.z)*f;
  m.rotation.x+=(t.rx-m.rotation.x)*f;m.rotation.y+=(t.ry-m.rotation.y)*f;});
 if(G&&G.players)G.players.forEach((p,i)=>{const e=$('lb'+i);if(!e)return;const t=pAng(i);v.set(Math.sin(t)*(TR-.45),0,Math.cos(t)*(TR-.45)).project(cam);
  e.style.left=(v.x+1)/2*innerWidth+'px';e.style.top=(1-v.y)/2*innerHeight+'px';e.className='lb'+(i===0?' me':'')+(G.cur===i&&G.phase!=='end'?' on':'');e.innerHTML=`<b>${p.name}</b>${p.total} poin${(p.gempi||p.kc)?'<div class="st">'+(p.gempi?'<span class="gp">GEMPI!</span>':'')+(p.kc?'<span class="kc">KECEBUR!</span>':'')+'</div>':''}`;});
 rd.render(scene,cam);}
Snd.refresh();fit();menu();loop();
</script><script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));document.addEventListener('gesturestart',e=>e.preventDefault());</script>
